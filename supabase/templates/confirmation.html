<div style="background:#0b0c10;padding:32px 16px;font-family:Inter,Arial,sans-serif;color:#edeef2">
  <div style="max-width:440px;margin:0 auto;background:#111318;border:1px solid #1f222b;border-radius:16px;padding:28px">
    <p style="margin:0 0 16px;font-size:22px;font-weight:800">Isfrid<span style="color:#a0a6b4;font-weight:600">Verse</span></p>
    <h1 style="margin:0 0 8px;font-size:20px">Confirm your account</h1>
    <p style="margin:0 0 24px;color:#c9cdd6;line-height:1.5">Tap the button to activate your account and start reading.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/account"
       style="display:inline-block;background:#6cc6ff;color:#04121f;font-weight:700;text-decoration:none;padding:12px 20px;border-radius:12px">Confirm my account</a>
    <p style="margin:24px 0 0;color:#a0a6b4;font-size:13px;line-height:1.5">If you didn't sign up for Isfridia, you can ignore this email.</p>
  </div>
</div>
